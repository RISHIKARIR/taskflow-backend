services:              # ye keyword hai — sabhi containers isi ke andar likhe jaate hain
  postgres:             # ek service ka naam (custom, tum kuch bhi rakh sakte ho)
    image: postgres:16  # Docker Hub se ready-made Postgres image use ho rahi hai
    environment:        # container ke andar environment variables set ho rahe hain
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: rishi@taskflow0098
      POSTGRES_DB: taskflow_db
    ports:
      - "5432:5432"     # host_port:container_port mapping
    volumes:
      - pgdata:/var/lib/postgresql/data   # data persist karne ke liye

  redis:                # doosri service — Redis
    image: redis:7
    ports:
      - "6379:6379"

volumes:                # named volume declare ho raha hai (data storage ke liye)
  pgdata:


